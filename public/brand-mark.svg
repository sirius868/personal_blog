<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Hang's Blog mark</title>
  <desc id="desc">A dark emerald abstract monogram mark.</desc>
  <defs>
    <radialGradient id="glow" cx="42%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#00ff80" stop-opacity="0.42"/>
      <stop offset="48%" stop-color="#123f2d" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#050907" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="stroke" x1="18" y1="8" x2="82" y2="88">
      <stop offset="0%" stop-color="#8dffbf"/>
      <stop offset="54%" stop-color="#00ff80"/>
      <stop offset="100%" stop-color="#0b5f38"/>
    </linearGradient>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#00ff80" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="24" fill="#07100c"/>
  <rect x="8.5" y="8.5" width="79" height="79" rx="20" fill="url(#glow)" stroke="#1f4a37"/>
  <g filter="url(#soft-shadow)">
    <path d="M27 66V30" fill="none" stroke="url(#stroke)" stroke-width="8" stroke-linecap="round"/>
    <path d="M69 30v36" fill="none" stroke="url(#stroke)" stroke-width="8" stroke-linecap="round"/>
    <path d="M31 50c11-16 26-16 34 0" fill="none" stroke="url(#stroke)" stroke-width="8" stroke-linecap="round"/>
    <path d="M35 67c9 5 20 5 29 0" fill="none" stroke="#8dffbf" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="68" cy="28" r="3" fill="#8dffbf"/>
</svg>
